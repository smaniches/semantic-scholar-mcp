repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17  # keep equal to ruff== in requirements-dev.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0  # keep equal to mypy== in requirements-dev.lock
    hooks:
      - id: mypy
        # Keep in step with the runtime pin in pyproject.toml ("mcp>=1.28.1,<2").
        additional_dependencies: ["mcp>=1.28.1,<2", "httpx>=0.25.0", "pydantic>=2.0.0"]
        args: [--strict]
        files: ^src/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        # Unpinned on purpose: `rev` already pins bandit, and pre-commit's shallow
        # clone reports version 0.0.0, so a `==` pin here is unresolvable.
        additional_dependencies: ["bandit[toml]"]
        files: ^src/
