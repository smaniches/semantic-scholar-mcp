name: API Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC: catch S2 changes early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-compat:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Locked closures, then an editable install that needs no index: the
      # build closure supplies hatchling + editables, the development closure
      # supplies pytest and the rest of the gates.
      - name: Install locked build closure
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Install locked development closure
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install this package offline (editable, no deps, no build isolation)
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: API compatibility tests
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: pytest tests/test_api_compatibility.py -v --tb=short -x
