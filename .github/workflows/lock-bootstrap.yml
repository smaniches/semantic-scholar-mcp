name: Lock Bootstrap
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned lock generator
        run: python -m pip install "uv==0.11.29"
      - name: Generate Python-floor locks
        run: scripts/regenerate-locks.sh --upgrade
      - name: Commit generated locks to the PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "Santiago Maniches"
          git config user.email "santiago@topologica.ai"
          git add requirements-dev.lock requirements-build.lock requirements-release.lock
          if git diff --cached --quiet; then
            echo "Locks are already current."
            exit 0
          fi
          git commit --signoff -m "chore: materialize Python-floor locks"
          git push origin "HEAD:${HEAD_BRANCH}"
