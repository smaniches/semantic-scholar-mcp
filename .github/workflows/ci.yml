name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked dependencies
      run: |
        python -m pip install --require-hashes -r requirements-build.lock
        python -m pip install --require-hashes -r requirements-dev.lock
    - name: Install package without dependency resolution
      env:
        PIP_NO_INDEX: "1"
      run: python -m pip install --no-deps --no-build-isolation -e .
    - name: Lint with ruff
      run: ruff check src/ tests/
    - name: Format check with ruff
      run: ruff format --check src/ tests/
    - name: Type check with mypy
      run: mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix size: skip some OS/version combos
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install locked dependencies
      run: |
        python -m pip install --require-hashes -r requirements-build.lock
        python -m pip install --require-hashes -r requirements-dev.lock
    - name: Install package without dependency resolution
      env:
        PIP_NO_INDEX: "1"
      run: python -m pip install --no-deps --no-build-isolation -e .
    - name: Test with coverage
      run: pytest --cov=src/semantic_scholar_mcp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --tb=short -q
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Offline Package Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked release tools
      run: python -m pip install --require-hashes -r requirements-release.lock
    - name: Build package without index access
      env:
        PIP_NO_INDEX: "1"
      run: python -m build --no-isolation
    - name: Verify package metadata
      run: python -m twine check dist/*
    - name: Verify pinned MCP publisher
      run: scripts/install-mcp-publisher.sh "$RUNNER_TEMP/mcp-publisher"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        languages: python
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked security tools
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: SAST scan
      run: bandit -c pyproject.toml -r src/
