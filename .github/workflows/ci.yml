name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    # Both closures are installed from hash-pinned locks: the build closure
    # supplies hatchling + editables so the editable install below needs no
    # index, and the development closure supplies the gates themselves.
    - name: Install locked build closure
      run: python -m pip install --require-hashes -r requirements-build.lock
    - name: Install locked development closure
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Install this package offline (editable, no deps, no build isolation)
      env:
        PIP_NO_INDEX: "1"
      run: python -m pip install --no-deps --no-build-isolation -e .
    - name: Lint with ruff
      run: ruff check src/ tests/
    - name: Format check with ruff
      run: ruff format --check src/ tests/
    - name: Type check with mypy
      run: mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix size: skip some OS/version combos
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install locked build closure
      run: python -m pip install --require-hashes -r requirements-build.lock
    - name: Install locked development closure
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Install this package offline (editable, no deps, no build isolation)
      env:
        PIP_NO_INDEX: "1"
      run: python -m pip install --no-deps --no-build-isolation -e .
    - name: Test with coverage
      run: pytest --cov=src/semantic_scholar_mcp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --tb=short -q
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: python
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    # bandit comes from the hash-pinned development closure, so a new bandit
    # release adding a check cannot turn main red with no code change. bandit
    # reads source files directly; the package itself is not installed here.
    - name: Install locked development closure
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: SAST scan
      run: python -m bandit -c pyproject.toml -r src/

  build-offline:
    name: Offline package build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked build closure
      run: python -m pip install --require-hashes -r requirements-build.lock
    # PIP_NO_INDEX proves the locked closure is complete: --no-isolation stops
    # build from provisioning a backend of its own, so a missing build-time
    # dependency fails here instead of being silently fetched from PyPI.
    - name: Build sdist and wheel offline
      env:
        PIP_NO_INDEX: "1"
      run: python -m build --no-isolation
    - name: Show built distributions
      run: ls -l dist/
