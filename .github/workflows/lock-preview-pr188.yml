name: Temporary lock regeneration preview (PR 188)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.head_ref == 'fix/s2-author-batch-identity-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.29
      - name: Generate exact universal locks
        run: scripts/regenerate-locks.sh
      - name: Expose generated development lock for reproducible commit
        run: |
          echo 'LOCK_PREVIEW_BEGIN'
          sed 's/^/LOCK_PREVIEW_LINE=/' requirements-dev.lock
          echo 'LOCK_PREVIEW_END'
          echo 'LOCK_PREVIEW_GIT_SHA_BEGIN'
          git hash-object requirements-dev.lock
          echo 'LOCK_PREVIEW_GIT_SHA_END'
