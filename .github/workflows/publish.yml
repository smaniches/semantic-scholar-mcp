name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual / programmatic trigger. release-please.yml dispatches this after
  # creating a release because GITHUB_TOKEN-authored release events do not
  # fan out to other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. semantic-scholar-mcp-v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for Sigstore-backed attestations
      attestations: write   # persist provenance + SBOM attestations

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Build from the exact tag when dispatched with inputs.tag, so the
        # published wheel reflects the released code rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - name: Install build tools
      run: python -m pip install --upgrade pip build
    - name: Build package
      run: python -m build
    - name: Verify package
      run: |
        pip install twine
        twine check dist/*
    - name: Generate CycloneDX SBOM
      run: |
        python -m venv /tmp/sbom-venv
        /tmp/sbom-venv/bin/pip install --quiet dist/*.whl
        python -m pip install --quiet cyclonedx-bom
        cyclonedx-py environment /tmp/sbom-venv/bin/python \
          --pyproject pyproject.toml \
          --output-format JSON \
          --spec-version 1.5 \
          --output-file sbom.cdx.json
    - name: Attest build provenance for the distributions
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
      with:
        subject-path: dist/*
    - name: Attest the CycloneDX SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
      with:
        subject-path: dist/*
        sbom-path: sbom.cdx.json
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom
        path: sbom.cdx.json

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/s2-mcp-server
    permissions:
      id-token: write  # Trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        # Sigstore-backed PEP 740 attestations are on by default under trusted
        # publishing; set explicitly to make the supply-chain posture obvious.
        attestations: true

  publish-mcp-registry:
    name: Publish to MCP Registry
    # Runs only after the PyPI publish succeeds: the registry validates that the
    # pip package referenced by server.json (s2-mcp-server == its version) is
    # live, so the distribution must exist first. Hence a job here rather than a
    # separately dispatched workflow.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read     # actions/checkout
      id-token: write    # GitHub OIDC -> MCP Registry auth (io.github.* namespace)

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Check out the released tag so the published server.json version
        # matches the release rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}

    # Trusted publishing returns before the new version is queryable on PyPI's
    # CDN-fronted JSON API, which the registry's package-ownership check reads.
    # `needs: publish-pypi` orders the jobs; this short poll absorbs the
    # index-propagation lag so the publish below can't fail spuriously.
    - name: Wait for the PyPI version to be queryable
      run: |
        version="$(jq -r '.packages[0].version' server.json)"
        echo "Confirming s2-mcp-server==${version} is queryable on PyPI..."
        for attempt in $(seq 1 20); do
          if curl --fail --silent --show-error --location \
               "https://pypi.org/pypi/s2-mcp-server/${version}/json" >/dev/null; then
            echo "s2-mcp-server==${version} is live."
            exit 0
          fi
          echo "Attempt ${attempt}: not queryable yet; retrying in 15s..."
          sleep 15
        done
        echo "::error::s2-mcp-server did not become queryable on PyPI in time."
        exit 1

    - name: Install mcp-publisher
      env:
        # Pinned to a specific release rather than the mutable `latest`, to match
        # this repo's pin-everything supply-chain posture. Bump deliberately.
        MCP_PUBLISHER_VERSION: v1.7.9
      run: |
        curl --fail --silent --show-error --location \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
          | tar -xz mcp-publisher

    - name: Authenticate to the MCP Registry via GitHub OIDC
      # No secret required: OIDC proves this run belongs to smaniches/*, which
      # owns the io.github.smaniches/* namespace. The `mcp-name` marker in
      # README.md ties the PyPI package to this registry entry.
      run: ./mcp-publisher login github-oidc

    - name: Publish server.json to the MCP Registry
      run: ./mcp-publisher publish
