name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual / programmatic trigger. release-please.yml dispatches this after
  # creating a release because GITHUB_TOKEN-authored release events do not
  # fan out to other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. semantic-scholar-mcp-v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for Sigstore-backed attestations
      attestations: write   # persist provenance + SBOM attestations

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Build from the exact tag when dispatched with inputs.tag, so the
        # published wheel reflects the released code rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install build tools
      run: python -m pip install --upgrade pip build
    - name: Build package
      run: python -m build
    - name: Verify package
      run: |
        pip install twine
        twine check dist/*
    - name: Generate CycloneDX SBOM
      run: |
        python -m venv /tmp/sbom-venv
        /tmp/sbom-venv/bin/pip install --quiet dist/*.whl
        python -m pip install --quiet cyclonedx-bom
        cyclonedx-py environment /tmp/sbom-venv/bin/python \
          --pyproject pyproject.toml \
          --output-format JSON \
          --spec-version 1.5 \
          --output-file sbom.cdx.json
    - name: Attest build provenance for the distributions
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
      with:
        subject-path: dist/*
    - name: Attest the CycloneDX SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
      with:
        subject-path: dist/*
        sbom-path: sbom.cdx.json
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom
        path: sbom.cdx.json

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/s2-mcp-server
    permissions:
      id-token: write  # Trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
      with:
        # Sigstore-backed PEP 740 attestations are on by default under trusted
        # publishing; set explicitly to make the supply-chain posture obvious.
        attestations: true

  # ── Publish server.json to the official MCP Registry ─────────────────────
  # (registry.modelcontextprotocol.io) so the public listing tracks every
  # release automatically, instead of drifting behind PyPI. Runs after
  # publish-pypi because the registry's package-ownership check reads the
  # just-published PyPI release. Ownership is proven two ways, no secret/PAT
  # required:
  #   - package: the ``mcp-name: io.github.smaniches/semantic-scholar-mcp``
  #     marker in README.md (which is the PyPI long description).
  #   - namespace ``io.github.smaniches``: GitHub OIDC (id-token below).
  # server.json already carries the released version (release-please bumps
  # it via extra-files), so no version rewrite step is needed.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC -> MCP Registry (io.github.* namespace)
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Install mcp-publisher
      # Intentionally tracks ``latest`` rather than a SHA/version pin. The
      # MCP Registry is in preview and rotates its OIDC audience between
      # deployments; an older binary fails with "invalid audience", and the
      # official GitHub Actions guide instructs re-installing latest for
      # exactly this reason. Fetched over HTTPS from the official
      # modelcontextprotocol/registry releases.
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
    - name: Authenticate to MCP Registry (GitHub OIDC)
      run: ./mcp-publisher login github-oidc
    - name: Publish server.json to MCP Registry
      run: ./mcp-publisher publish
