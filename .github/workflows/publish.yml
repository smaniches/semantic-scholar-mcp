name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual / programmatic trigger. release-please.yml dispatches this after
  # creating a release because GITHUB_TOKEN-authored release events do not
  # fan out to other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. semantic-scholar-mcp-v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for Sigstore-backed attestations
      attestations: write   # persist provenance + SBOM attestations

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        # Build from the exact tag when dispatched with inputs.tag, so the
        # published wheel reflects the released code rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Install build tools
      run: python -m pip install --upgrade pip build
    - name: Build package
      run: python -m build
    - name: Verify package
      run: |
        pip install twine
        twine check dist/*
    - name: Generate CycloneDX SBOM
      run: |
        python -m venv /tmp/sbom-venv
        /tmp/sbom-venv/bin/pip install --quiet dist/*.whl
        python -m pip install --quiet cyclonedx-bom
        cyclonedx-py environment /tmp/sbom-venv/bin/python \
          --pyproject pyproject.toml \
          --output-format JSON \
          --spec-version 1.5 \
          --output-reproducible \
          --output-file sbom.cdx.json
    - name: Attest build provenance for the distributions
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
      with:
        subject-path: dist/*
    - name: Attest the CycloneDX SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
      with:
        subject-path: dist/*
        sbom-path: sbom.cdx.json
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom
        path: sbom.cdx.json

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/s2-mcp-server
    permissions:
      id-token: write  # Trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        # Sigstore-backed PEP 740 attestations are on by default under trusted
        # publishing; set explicitly to make the supply-chain posture obvious.
        attestations: true
