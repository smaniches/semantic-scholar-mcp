name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual / programmatic trigger. release-please.yml dispatches this after
  # creating a release because GITHUB_TOKEN-authored release events do not
  # fan out to other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. semantic-scholar-mcp-v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for the Sigstore-backed build provenance
      attestations: write   # persist the build-provenance attestation

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Build from the exact tag when dispatched with inputs.tag, so the
        # published wheel reflects the released code rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    # One hash-pinned closure supplies every release tool this job uses: the
    # build backend and twine. Nothing below it installs from the network; the
    # wheel's runtime dependency graph is intentionally resolved only in the
    # unprivileged `sbom` job, never next to attestation authority.
    - name: Install locked release closure
      run: python -m pip install --require-hashes -r requirements-release.lock
    - name: Build package
      run: python -m build --no-isolation
    - name: Verify package
      run: python -m twine check dist/*
    - name: Attest build provenance for the distributions
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      with:
        subject-path: dist/*
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/

  # ── Generate the CycloneDX SBOM in an unprivileged job ───────────────────
  # Resolving the wheel's runtime dependency graph necessarily downloads from
  # the network, so it must not share a job with OIDC or attestation
  # authority. This job holds contents: read and nothing else. Beyond that
  # privilege boundary, the resolved graph is data, never code: pip download
  # --only-binary=:all: fails closed on any source distribution (so no build
  # backend can run), nothing from the wheelhouse is installed or imported,
  # and no interpreter populated with dependency code is ever started (so no
  # .pth or sitecustomize hook can run either). The document that attest-sbom
  # later signs is derived purely from static wheel METADATA by
  # scripts/release_sbom.py plus cyclonedx-py from the hash-pinned release
  # closure.
  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The same release source identity as the build job.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked release closure
      run: python -m pip install --require-hashes -r requirements-release.lock
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Assert exactly one built wheel
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "expected exactly one wheel in dist/, found ${#wheels[@]}: ${wheels[*]}" >&2
          exit 1
        fi
    - name: Resolve the runtime dependency graph as wheels only (no execution)
      run: >-
        python -m pip download --only-binary=:all:
        --dest /tmp/sbom-wheelhouse dist/*.whl
    - name: Derive the static dependency manifest from wheel metadata
      run: >-
        python scripts/release_sbom.py lock --dist dist
        --wheelhouse /tmp/sbom-wheelhouse --output sbom-requirements.txt
    - name: Generate CycloneDX SBOM from the static manifest
      run: |
        cyclonedx-py requirements sbom-requirements.txt \
          --pyproject pyproject.toml \
          --output-format JSON \
          --spec-version 1.5 \
          --output-file sbom.cdx.json
    - name: Bind the SBOM root component to the exact wheel
      run: python scripts/release_sbom.py bind --sbom sbom.cdx.json --dist dist
    - name: Independently verify the SBOM/wheel binding
      run: >-
        python scripts/release_sbom.py verify --sbom sbom.cdx.json --dist dist
        --requirements sbom-requirements.txt
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom
        path: sbom.cdx.json

  # ── Attest the verified SBOM with minimal privilege ──────────────────────
  # This job downloads two finished artifacts and signs one against the
  # other. It checks out nothing, installs nothing, and resolves no
  # dependencies, so attestation authority never coexists with live
  # dependency resolution. The subject is the wheel alone: the SBOM
  # describes the wheel's statically resolved runtime dependency graph, so
  # attesting it against the sdist would assert a relationship that was
  # never established.
  attest-sbom:
    name: Attest SBOM
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for the Sigstore-backed SBOM attestation
      attestations: write   # persist the SBOM attestation

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Download SBOM
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom
    - name: Attest the CycloneDX SBOM against the wheel
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
      with:
        subject-path: dist/*.whl
        sbom-path: sbom.cdx.json

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sbom, attest-sbom]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/s2-mcp-server
    permissions:
      id-token: write  # Trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        # Sigstore-backed PEP 740 attestations are on by default under trusted
        # publishing; set explicitly to make the supply-chain posture obvious.
        attestations: true

  # ── Publish server.json to the official MCP Registry ─────────────────────
  # (registry.modelcontextprotocol.io) so the public listing tracks every
  # release automatically, instead of drifting behind PyPI. Runs after
  # publish-pypi because the registry's package-ownership check reads the
  # just-published PyPI release. Ownership is proven two ways, no secret/PAT
  # required:
  #   - package: the ``mcp-name: io.github.smaniches/semantic-scholar-mcp``
  #     marker in README.md (which is the PyPI long description).
  #   - namespace ``io.github.smaniches``: GitHub OIDC (id-token below).
  # server.json already carries the released version (release-please bumps
  # it via extra-files), so no version rewrite step is needed.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC -> MCP Registry (io.github.* namespace)
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Install mcp-publisher
      # Pinned to an exact release and verified by digest, archive membership,
      # and self-reported version, so this step cannot silently execute a
      # different binary than the one reviewed here. This replaces tracking
      # ``latest``: an unpinned download is the one unreviewed executable in
      # the release path. The MCP Registry is in preview and rotates its OIDC
      # audience between deployments, so if authentication ever fails with
      # "invalid audience", bump the pinned version in the installer rather
      # than reverting to ``latest``.
      run: scripts/install-mcp-publisher.sh
    - name: Authenticate to MCP Registry (GitHub OIDC)
      run: ./mcp-publisher login github-oidc
    - name: Publish server.json to MCP Registry
      run: ./mcp-publisher publish
