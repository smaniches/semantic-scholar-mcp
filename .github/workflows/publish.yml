name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual / programmatic trigger. release-please.yml dispatches this after
  # creating a release because GITHUB_TOKEN-authored release events do not
  # fan out to other workflows.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. semantic-scholar-mcp-v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # Build from the exact tag when dispatched with inputs.tag, so the
        # published wheel reflects the released code rather than main HEAD.
        ref: ${{ inputs.tag || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install build tools
      run: python -m pip install --upgrade pip build
    - name: Build package
      run: python -m build
    - name: Verify package
      run: |
        pip install twine
        twine check dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/s2-mcp-server
    permissions:
      id-token: write  # Trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
