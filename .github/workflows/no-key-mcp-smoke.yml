name: Live anonymous MCP smoke

# Advisory live end-to-end check: starts a real MCP server and uses the
# external Semantic Scholar anonymous pool. 429 responses are upstream
# availability limitations, not deterministic regressions in local code.
# Do not gate every PR on this external shared anonymous rate-limit pool;
# the regular CI has separate protocol/validation tests for both transports.
on:
  workflow_dispatch:
  # Validate changes to the probe immediately, not just on next week's schedule.
  pull_request:
    paths:
      - ".github/workflows/no-key-mcp-smoke.yml"
      - "scripts/smoke_no_key_mcp.py"
      - "scripts/smoke_http_no_key.py"
  schedule:
    - cron: "13 7 * * 1"

permissions:
  contents: read

jobs:
  anonymous-mcp:
    name: Public API and MCP stdio (no token)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked build closure
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Install locked development closure
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install server from checkout (offline)
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: MCP stdio and anonymous live graph probe
        env:
          SEMANTIC_SCHOLAR_API_KEY: ""
        shell: bash
        run: |
          # The script returns 75 only for the specifically identified
          # upstream anonymous API 429; other nonzero statuses still fail.
          status=0
          python scripts/smoke_no_key_mcp.py || status=$?
          case "$status" in
            0)
              echo "### Anonymous MCP live pagination: PASS" >> "$GITHUB_STEP_SUMMARY"
              ;;
            75)
              echo "::warning title=Upstream Semantic Scholar HTTP 429::Anonymous live pagination could not be verified; MCP stdio handshake and tool listing passed."
              {
                echo "### Anonymous MCP live pagination: INCONCLUSIVE"
                echo "The upstream anonymous API returned HTTP 429 after retries."
                echo "The stdio MCP handshake and tool listing passed, but live"
                echo "pagination is **NOT VERIFIED**. This is not a live-test pass."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### Anonymous MCP live pagination: FAIL (exit $status)" >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
              ;;
          esac

      - name: Streamable HTTP MCP handshake and real no-key paper retrieval
        env:
          SEMANTIC_SCHOLAR_API_KEY: ""
        run: python scripts/smoke_http_no_key.py
