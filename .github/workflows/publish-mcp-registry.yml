name: Verify Official MCP Registry Metadata

on:
  pull_request:
    paths:
      - "server.json"
      - "scripts/verify-mcp-registry-record.sh"
      - ".github/workflows/publish-mcp-registry.yml"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-verify-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate manifest and registry state
    runs-on: ubuntu-latest
    env:
      EXPECTED_SERVER_NAME: io.github.smaniches/semantic-scholar-mcp
      EXPECTED_PACKAGE_ID: s2-mcp-server
      EXPECTED_REPOSITORY_URL: https://github.com/smaniches/semantic-scholar-mcp

    steps:
      - name: Fetch immutable verification inputs
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          head_base="https://raw.githubusercontent.com/${HEAD_REPOSITORY}/${HEAD_SHA}"
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output server.json \
            "${head_base}/server.json"
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output /tmp/verify-mcp-registry-record.sh \
            "${head_base}/scripts/verify-mcp-registry-record.sh"
          bash -n /tmp/verify-mcp-registry-record.sh

          if [[ -n "$BASE_SHA" ]]; then
            curl --fail --show-error --location --retry 4 --retry-all-errors \
              --proto '=https' --tlsv1.2 --output server.base.json \
              "https://raw.githubusercontent.com/${BASE_REPOSITORY}/${BASE_SHA}/server.json"
          fi

      - name: Verify Official MCP Registry state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server.base.json ]]; then
            bash /tmp/verify-mcp-registry-record.sh server.json \
              --base-manifest server.base.json \
              --allow-missing-new-version
          else
            bash /tmp/verify-mcp-registry-record.sh server.json
          fi

      - name: Write verification summary
        if: always()
        shell: bash
        run: |
          state="unknown"
          [[ -f /tmp/mcp-registry-state ]] && state="$(cat /tmp/mcp-registry-state)"
          server_name="$(jq -r '.name // "unresolved"' server.json 2>/dev/null || echo unresolved)"
          server_version="$(jq -r '.version // "unresolved"' server.json 2>/dev/null || echo unresolved)"
          {
            echo "### Official MCP Registry verification"
            echo ""
            echo "- Server: \`${server_name}\`"
            echo "- Version: \`${server_version}\`"
            echo "- Registry state: \`${state}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Final job status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
