name: Dependency Audit

# CVE audit of the hash-pinned dev lock. Runs on pull requests (so a vulnerable
# dependency cannot be merged) and weekly on a schedule (so a newly disclosed
# CVE surfaces as a visible failing run). It deliberately does NOT run on push
# to main: the advisory database changes independently of the code, and a CVE
# disclosed after a merge should be a signal, not a red main branch that blocks
# unrelated work. See CONTRIBUTING.md ("A red Dependency Audit") for remediation.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
    - name: Install pip-audit (pinned to requirements-dev.lock)
      run: pip install "pip-audit==2.10.1"
    - name: Audit the hash-pinned dev lock
      run: pip-audit -r requirements-dev.lock --strict
