name: Dependency Audit

# CVE audit of the hash-pinned dev lock. Runs on pull requests (so a vulnerable
# dependency cannot be merged) and weekly on a schedule (so a newly disclosed
# CVE surfaces as a visible failing run). It deliberately does NOT run on push
# to main: the advisory database changes independently of the code, and a CVE
# disclosed after a merge should be a signal, not a red main branch that blocks
# unrelated work. See CONTRIBUTING.md ("A red Dependency Audit") for remediation.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency CVE audit
    # Audit on Linux and Windows. The universal lock carries win32-only pins
    # (pywin32, colorama) that PEP 508 markers skip on a Linux-only runner, so a
    # Windows leg is needed to surface CVEs in those locked packages. The lock
    # has no Darwin-specific pins, so macOS would be redundant.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked audit environment
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Audit the hash-pinned dev lock
      run: python -m pip_audit -r requirements-dev.lock --strict
