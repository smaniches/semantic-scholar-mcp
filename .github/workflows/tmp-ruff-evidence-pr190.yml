name: Temporary Ruff formatting evidence PR190
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    if: github.head_ref == 'fix/s2-upstream-response-integrity-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact locked Ruff
        run: python -m pip install 'ruff==0.15.17'
      - name: Show exact format-only diff
        run: |
          ruff format src/semantic_scholar_mcp/server.py tests/test_upstream_response_integrity.py
          echo 'RUFF_FORMAT_DIFF_BEGIN'
          git -c color.ui=false diff -- src/semantic_scholar_mcp/server.py tests/test_upstream_response_integrity.py
          echo 'RUFF_FORMAT_DIFF_END'
