name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Configure MCP server with...
        2. Ask Claude to...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include full error messages and stack traces
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python Version
      options: ["3.10", "3.11", "3.12", "3.13"]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: api_key
    attributes:
      label: API Key Status
      options: ["Using API key", "No API key (unauthenticated)"]
    validations:
      required: true
